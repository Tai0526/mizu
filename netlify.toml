# Netlify build + deploy config for Mizu (Vite + React).
# The app lives in /frontend, so the build runs there and publishes its dist folder.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: send every route back to index.html so react-router handles
# deep links and page refreshes instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The HTML shell must be revalidated every visit, otherwise a browser keeps
# serving an old index.html pointing at JS a new deploy already deleted.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite fingerprints built assets, so a given filename's content never changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
